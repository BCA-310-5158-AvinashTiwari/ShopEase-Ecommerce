<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Orders - ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-PENDING { background: #ffc107; color: #000; }
        .status-PROCESSING { background: #17a2b8; color: #fff; }
        .status-SHIPPED { background: #007bff; color: #fff; }
        .status-DELIVERED { background: #28a745; color: #fff; }
        .status-CANCELLED { background: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">ShopEase Admin</a>
            <a href="/" class="btn btn-outline-light btn-sm">View Site</a>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="mb-3">Manage Orders</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Order ID</th>
                        <th>User</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td>#<span th:text="${order.id}"></span></td>
                        <td th:text="${order.user.name}"></td>
                        <td>₹<span th:text="${order.totalAmount}"></span></td>
                        <td>
                            <span th:class="'status-badge status-' + ${order.status}" th:text="${order.status}"></span>
                        </td>
                        <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}"></td>
                        <td>
                            <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-flex gap-1">
                                <select name="status" class="form-select form-select-sm">
                                    <option th:each="s : ${T(com.shopease.entity.Order.Status).values()}" 
                                            th:value="${s}" 
                                            th:selected="${s == order.status}" 
                                            th:text="${s}">
                                    </option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-primary">Update</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="/admin/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </div>
</body>
</html>
